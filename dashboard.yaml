views:
  - title: EP2500
    path: ep2500
    icon: mdi:home-battery
    type: sections
    max_columns: 3
    dense_section_placement: false
    sections:
      # ------------------------------------------------------------------
      # Spalte 1: Ausgelesene Werte
      # ------------------------------------------------------------------
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Readings
            heading_style: title
            icon: mdi:gauge
          - type: vertical-stack
            cards:
              - type: gauge
                entity: sensor.oukitel_ep2500_state_of_charge
                name: State of charge
                unit: '%'
                min: 0
                max: 100
                severity:
                  green: 50
                  yellow: 20
                  red: 0
              - type: markdown
                content: >-
                  {% set r = states('sensor.oukitel_ep2500_remaining_runtime') %}

                  {% if r not in ['unknown', 'unavailable', 'none', ''] %} {% set h
                  = r | float %} <center>Lasts another <b>{{ h | int }} h {{ ((h - (h
                  | int)) * 60) | round(0) | int }} min</b> at the current
                  load</center> {% elif
                  states('sensor.oukitel_ep2500_battery_power') | float(0) > 5 %}
                  <center>Battery charging</center> {% else %} <center>Not discharging</center> {% endif %}
              - type: glance
                title: Now
                columns: 6
                state_color: false
                entities:
                  - entity: sensor.oukitel_ep2500_pv_power
                    name: PV
                  - entity: sensor.oukitel_ep2500_ac_output_power
                    name: Export
                  - entity: sensor.oukitel_ep2500_battery_power
                    name: Battery
                  - entity: sensor.oukitel_ep2500_meter_power_controller
                    name: Meter
                  - entity: sensor.oukitel_ep2500_shelly_power
                    name: Shelly
                  - entity: sensor.oukitel_ep2500_north_pv_power
                    name: North PV
          - type: entities
            title: Power
            show_header_toggle: false
            entities:
              - entity: sensor.oukitel_ep2500_pv_power
                name: PV total
              - entity: sensor.oukitel_ep2500_pv_energy_today
                name: PV energy today
              - entity: sensor.oukitel_ep2500_pv_energy_total
                name: PV energy total
              - entity: sensor.oukitel_ep2500_pv_charge_limit
                name: PV charge limit
              - entity: sensor.oukitel_ep2500_ac_output_power
                name: AC output
              - entity: sensor.oukitel_ep2500_grid_power
                name: Grid power
              - entity: sensor.oukitel_ep2500_off_grid_load
                name: Off-grid load
              - entity: sensor.oukitel_ep2500_off_grid_voltage
                name: Off-grid voltage
              - entity: sensor.oukitel_ep2500_off_grid_current
                name: Off-grid current
          - type: entities
            title: PV strings
            show_header_toggle: false
            entities:
              - entity: sensor.oukitel_ep2500_pv1_power
                name: PV1
              - entity: sensor.oukitel_ep2500_pv1_voltage
                name: '  PV1 voltage'
              - entity: sensor.oukitel_ep2500_pv1_current
                name: '  PV1 current'
              - type: divider
              - entity: sensor.oukitel_ep2500_pv2_power
                name: PV2
              - entity: sensor.oukitel_ep2500_pv2_voltage
                name: '  PV2 voltage'
              - entity: sensor.oukitel_ep2500_pv2_current
                name: '  PV2 current'
              - type: divider
              - entity: sensor.oukitel_ep2500_pv3_power
                name: PV3
              - entity: sensor.oukitel_ep2500_pv3_voltage
                name: '  PV3 voltage'
              - entity: sensor.oukitel_ep2500_pv3_current
                name: '  PV3 current'
              - type: divider
              - entity: sensor.oukitel_ep2500_pv4_power
                name: PV4
              - entity: sensor.oukitel_ep2500_pv4_voltage
                name: '  PV4 voltage'
              - entity: sensor.oukitel_ep2500_pv4_current
                name: '  PV4 current'
          - type: entities
            title: Battery & grid
            show_header_toggle: false
            entities:
              - entity: sensor.oukitel_ep2500_battery_voltage
                name: Battery voltage
              - entity: sensor.oukitel_ep2500_cell_voltage_max
                name: Cell voltage max
              - entity: sensor.oukitel_ep2500_cell_voltage_min
                name: Cell voltage min
              - entity: sensor.oukitel_ep2500_temperature_1
                name: Temperature 1
              - entity: sensor.oukitel_ep2500_temperature_2
                name: Temperature 2
              - type: divider
              - entity: sensor.oukitel_ep2500_grid_voltage
                name: Grid voltage
              - entity: sensor.oukitel_ep2500_grid_current
                name: Grid current
              - entity: sensor.oukitel_ep2500_grid_frequency
                name: Grid frequency

      # ------------------------------------------------------------------
      # Spalte 2: Steuerung und Einstellungen
      # ------------------------------------------------------------------
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Control & settings
            heading_style: title
            icon: mdi:tune-vertical
          - type: entities
            title: Switches & limits
            show_header_toggle: false
            entities:
              - entity: switch.oukitel_ep2500_zero_export_control
                name: Control active
              - entity: switch.oukitel_ep2500_pass_through_when_battery_full
                name: Pass-through when battery full
              - entity: binary_sensor.oukitel_ep2500_pass_through_running
                name: Pass-through running now
              - entity: switch.oukitel_ep2500_backflow_prevention
                name: Backflow prevention (blocks export)
              - entity: switch.oukitel_ep2500_off_grid_socket
                name: Off-grid socket
              - entity: input_boolean.ep2500_offgrid_night_off
                name: '  Off-grid off at night'
              - entity: switch.oukitel_ep2500_shelly_mains_disconnect
                name: Shelly (mains disconnect)
              - entity: text.oukitel_ep2500_shelly_ip
                name: Shelly IP
              - entity: switch.oukitel_ep2500_north_pv
                name: North PV
              - entity: text.oukitel_ep2500_north_pv_shelly_ip
                name: North PV Shelly IP
              - type: divider
              - entity: number.oukitel_ep2500_export_limit
                name: Export limit
              - entity: number.oukitel_ep2500_battery_charge_limit
                name: Battery charge limit (PV + grid)
              - entity: number.oukitel_ep2500_meter_target
                name: Meter target
              - type: divider
              - entity: number.oukitel_ep2500_charge_stop
                name: Charge stop (SoC max)
              - entity: number.oukitel_ep2500_discharge_stop
                name: Discharge stop (SoC min)
              - type: divider
              - entity: sensor.oukitel_ep2500_controller_setpoint
                name: Controller setpoint
              - entity: sensor.oukitel_ep2500_status
                name: Device status
              - entity: sensor.oukitel_ep2500_operating_mode
                name: Mode
          - type: entities
            title: Recording
            show_header_toggle: false
            entities:
              - entity: switch.oukitel_ep2500_record_log
                name: Record log
              - entity: sensor.oukitel_ep2500_recording
                name: Status
          - type: markdown
            content: >-
              {% set url = state_attr('sensor.oukitel_ep2500_recording',
              'url') %} {% if url %} <ha-alert alert-type="info">[Recordingen
              herunterladen]({{ url }})</ha-alert> {% else %} _Download-Adresse
              not reported yet._ {% endif %}
          - type: entities
            title: Controller fine-tuning
            show_header_toggle: false
            entities:
              - entity: number.oukitel_ep2500_control_interval
                name: Interval
              - entity: number.oukitel_ep2500_controller_gain
                name: Gain
              - entity: number.oukitel_ep2500_deadband
                name: Deadband
              - entity: number.oukitel_ep2500_max_step
                name: Max step
              - entity: number.oukitel_ep2500_pass_through_from_soc
                name: Pass-through from SoC
              - entity: number.oukitel_ep2500_pv_limit_when_open
                name: PV limit when open
          - type: history-graph
            title: Control behaviour (last 3 h)
            hours_to_show: 3
            refresh_interval: 10
            entities:
              - entity: sensor.oukitel_ep2500_meter_power_controller
                name: Meter
              - entity: sensor.oukitel_ep2500_controller_setpoint
                name: Setpoint
              - entity: sensor.oukitel_ep2500_ac_output_power
                name: Actual

      # ------------------------------------------------------------------
      # Spalte 3: Verlauf und Ereignisse
      # ------------------------------------------------------------------
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: History & events
            heading_style: title
            icon: mdi:chart-line
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.oukitel_ep2500_fault
                state: "on"
            card:
              type: markdown
              content: >-
                <ha-alert alert-type="error">**Systemfehler:** {{
                states('sensor.oukitel_ep2500_system_fault') }} (Rohwert {{
                state_attr('sensor.oukitel_ep2500_system_fault', 'rohwert')
                }}). Latched until the device is restarted.</ha-alert>
          - type: markdown
            title: Events (48 h)
            card_mod:
              style: |
                ha-card {
                  max-height: 420px;
                  overflow-y: auto;
                }
            content: >-
              {% set liste = state_attr('sensor.oukitel_ep2500_events',
              'eintraege') %}

              {% if liste %} {% for e in liste | reverse | list %} **{{ e.t }}** ·
              {{ e.m }}

              {% endfor %} {% else %} _No events recorded yet._ {%
              endif %}
          - type: history-graph
            title: Battery & PV (24 h)
            hours_to_show: 24
            entities:
              - entity: sensor.oukitel_ep2500_state_of_charge
                name: SoC
              - entity: sensor.oukitel_ep2500_pv_power
                name: PV
              - entity: sensor.oukitel_ep2500_battery_power
                name: Battery
          - type: history-graph
            title: PV strings over time (12 h)
            hours_to_show: 12
            entities:
              - entity: sensor.oukitel_ep2500_pv1_power
                name: PV1
              - entity: sensor.oukitel_ep2500_pv2_power
                name: PV2
              - entity: sensor.oukitel_ep2500_pv3_power
                name: PV3
              - entity: sensor.oukitel_ep2500_pv4_power
                name: PV4
          - type: history-graph
            title: Cell voltages (24 h)
            hours_to_show: 24
            entities:
              - entity: sensor.oukitel_ep2500_cell_voltage_max
                name: max
              - entity: sensor.oukitel_ep2500_cell_voltage_min
                name: min
