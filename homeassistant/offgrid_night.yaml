# Switch the EP2500 off-grid socket off between sunset and sunrise.
#
# Copy-paste source. The reasoning, the measurement behind it and the
# pitfalls are in docs/setup.md, section "The off-grid socket".
#
# Append these automations to automations.yaml. The separate helper is in
# input_boolean.yaml; include that file from configuration.yaml if needed.
# Written in the triggers/conditions/actions syntax used by Home Assistant
# 2024.10 and later. On older versions use trigger/condition/action instead.
#
# Entity IDs are from a default install. If yours differ, look them up under
# Developer tools > States and adjust.

- id: ep2500_offgrid_sunset
  alias: EP2500 - off-grid socket off at sunset
  description: >-
    Saves the inverter's standby draw for an empty socket overnight.
  mode: single
  triggers:
    - trigger: sun
      event: sunset
  conditions:
    - condition: state
      entity_id: input_boolean.ep2500_offgrid_night_off
      state: "on"
  actions:
    - action: switch.turn_off
      target:
        entity_id: switch.oukitel_ep2500_off_grid_socket
    - action: logbook.log
      data:
        name: EP2500
        message: Off-grid socket switched off at sunset.

- id: ep2500_offgrid_sunrise
  alias: EP2500 - off-grid socket on at sunrise
  description: >-
    Restores the socket in the morning while night switching is enabled.
  mode: single
  triggers:
    - trigger: sun
      event: sunrise
  conditions:
    - condition: state
      entity_id: input_boolean.ep2500_offgrid_night_off
      state: "on"
  actions:
    - action: switch.turn_on
      target:
        entity_id: switch.oukitel_ep2500_off_grid_socket
    - action: logbook.log
      data:
        name: EP2500
        message: Off-grid socket switched on at sunrise.

- id: ep2500_offgrid_apply_now
  alias: EP2500 - align off-grid socket when the helper changes
  description: >-
    Without this one, switching the helper on after sunset does nothing until
    the next evening, which looks like a broken switch.
  mode: single
  triggers:
    - trigger: state
      entity_id: input_boolean.ep2500_offgrid_night_off
      to: "on"
    - trigger: homeassistant
      event: start
  conditions:
    - condition: state
      entity_id: sun.sun
      state: below_horizon
  actions:
    - action: switch.turn_off
      target:
        entity_id: switch.oukitel_ep2500_off_grid_socket

- id: ep2500_offgrid_helper_off
  alias: EP2500 - restore off-grid socket when night switch is disabled
  description: >-
    Prevents the socket from remaining off after disabling the helper at night.
  mode: single
  triggers:
    - trigger: state
      entity_id: input_boolean.ep2500_offgrid_night_off
      to: "off"
  actions:
    - action: switch.turn_on
      target:
        entity_id: switch.oukitel_ep2500_off_grid_socket
