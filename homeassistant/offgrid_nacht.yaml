# Switch the EP2500 off-grid socket off between sunset and sunrise.
#
# Copy-paste source. The reasoning, the measurement behind it and the
# pitfalls are in docs/setup.md, section "The off-grid socket".
#
# The two blocks below go into two different files. Do not paste the whole
# file into one of them.

# ===========================================================================
# configuration.yaml  --  MERGE this into an existing input_boolean: block
# ===========================================================================
# If your configuration.yaml already has an `input_boolean:` key, add only the
# indented entry below to it. A second `input_boolean:` at the top level makes
# Home Assistant refuse to start with a duplicate key error.

input_boolean:
  ep2500_offgrid_nachtabschaltung:
    name: EP2500 Off-Grid nachts aus
    icon: mdi:weather-night

# ===========================================================================
# automations.yaml  --  append these three
# ===========================================================================
# Written in the triggers/conditions/actions syntax used by Home Assistant
# 2024.10 and later. On older versions use trigger/condition/action instead.
#
# Entity IDs are from a default install. If yours differ, look them up under
# Developer tools > States and adjust.

- id: ep2500_offgrid_sonnenuntergang
  alias: EP2500 - Off-Grid-Steckdose bei Sonnenuntergang aus
  description: >-
    Saves the inverter's standby draw for an empty socket overnight.
  mode: single
  triggers:
    - trigger: sun
      event: sunset
  conditions:
    - condition: state
      entity_id: input_boolean.ep2500_offgrid_nachtabschaltung
      state: "on"
  actions:
    - action: switch.turn_off
      target:
        entity_id: switch.oukitel_ep2500_off_grid_steckdose
    - action: logbook.log
      data:
        name: EP2500
        message: Off-Grid-Steckdose zum Sonnenuntergang abgeschaltet.

- id: ep2500_offgrid_sonnenaufgang
  alias: EP2500 - Off-Grid-Steckdose bei Sonnenaufgang an
  description: >-
    Deliberately has no condition. If the helper is switched off during the
    night, the socket should still come back in the morning rather than stay
    dead unnoticed.
  mode: single
  triggers:
    - trigger: sun
      event: sunrise
  actions:
    - action: switch.turn_on
      target:
        entity_id: switch.oukitel_ep2500_off_grid_steckdose
    - action: logbook.log
      data:
        name: EP2500
        message: Off-Grid-Steckdose zum Sonnenaufgang eingeschaltet.

- id: ep2500_offgrid_sofort
  alias: EP2500 - Off-Grid-Steckdose beim Umschalten angleichen
  description: >-
    Without this one, switching the helper on after sunset does nothing until
    the next evening, which looks like a broken switch.
  mode: single
  triggers:
    - trigger: state
      entity_id: input_boolean.ep2500_offgrid_nachtabschaltung
      to: "on"
  conditions:
    - condition: state
      entity_id: sun.sun
      state: below_horizon
  actions:
    - action: switch.turn_off
      target:
        entity_id: switch.oukitel_ep2500_off_grid_steckdose
