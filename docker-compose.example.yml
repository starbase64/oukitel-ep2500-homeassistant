# Copy to docker-compose.yml and fill in your values.
# docker-compose.yml is gitignored so your credentials stay local.

services:
  ep2500-bridge:
    build: .
    container_name: ep2500-bridge
    restart: unless-stopped
    environment:
      # --- required ---------------------------------------------------
      EP2500_ID:    "YOUR_DEVICE_ID"
      EP2500_IP:    "192.168.1.50"
      EP2500_KEY:   "YOUR_LOCAL_KEY"
      EP2500_PORT:  "6668"

      MQTT_HOST:    "192.168.1.10"
      MQTT_PORT:    "1883"
      MQTT_USER:    ""
      MQTT_PASS:    ""

      # --- grid meter -------------------------------------------------
      # "http" polls a meter directly, "mqtt" reads from GRID_TOPIC.
      # Expects power in watts: positive = importing, negative = exporting.
      GRID_SOURCE:  "http"
      ECO_URL:      "http://192.168.1.100/status"
      ECO_FIELD:    "power"
      ECO_INTERVAL: "5"
      ECO_SPIKE:    "600"
      # GRID_TOPIC:    "meter/power"
      # GRID_JSON_KEY: "power"

      # --- limits -----------------------------------------------------
      # LIMIT_MAX is what actually caps the feed-in. The device itself
      # accepts higher values without complaint.
      # Feed-in limit to fall back to when the meter stops
      # responding. 0 stops export entirely.
      GRID_FAIL_LIMIT: "0"
      LIMIT_MAX:    "800"
      LIMIT_SAFE:   "0"
      # Allowed range of "Meter target" in Home Assistant. Positive means
      # grid import, negative means deliberate grid export.
      METER_TARGET_MIN: "-2000"
      METER_TARGET_MAX: "2000"
      CHARGE_HW_MAX: "4000"
      BATT_WH:      "2048"

      # --- optional: Shelly plugs for cross-checking ------------------
      SHELLY_IP:    ""
      SHELLY2_IP:   ""
      # Shelly plugs measuring the input of up to two AC-coupled stores.
      # These can also be entered later in Home Assistant.
      # Points above the pass-through target at which protection against the
      # 100 % shutdown overrides a meter target. 0 disables the override.
      PASS_OVERRIDE: "3"
      # --- phases and surplus charging ---------------------------------
      # Which phase the EP2500 is wired to. Also selectable from the
      # dashboard; this is only the fallback before anything is stored.
      EP_PHASE:     "1"
      PHASE_SMOOTH: "0.25"
      # Seconds between phase lines in the log. 0 turns them off.
      PHASE_LOG_INTERVAL: "60"

      # Surplus charging probes before it commits: it raises the charge limit
      # by one step, waits, and checks whether the meter followed. If another
      # storage unit compensated, the meter does not move and charging stops.
      PROBE_SETTLE: "90"
      PROBE_ACCEPT: "0.6"
      SURPLUS_STEP: "200"
      SURPLUS_ENTER_W: "100"
      SURPLUS_ENTER_S: "120"
      SURPLUS_EXIT_S: "90"

      # Optional shortcut: if a neighbouring battery publishes its power over
      # MQTT, the bridge can skip the probing. Positive means discharging by
      # default; set NEIGHBOUR_SIGN to "charge_positive" if yours differs.
      NEIGHBOUR_TOPIC: ""
      NEIGHBOUR_FIELD: "bat_p"
      NEIGHBOUR_SIGN: "discharge_positive"

      AC_STORAGE1_IP: ""
      AC_STORAGE2_IP: ""
      AC_STORAGE_MAX_AGE: "15"
      AC_STORAGE_NOISE: "5"
      # Margin above the discharge stop at which the device releases the
      # off-grid output again. 5 on the unit this was written for.
      OFFGRID_SOC_MARGIN: "5"
      SHELLY_INTERVAL: "5"

      # --- logging ----------------------------------------------------
      # 0 = off, 1 = settings changes only, 2 = everything
      LOG_DPS:      "1"
      TZ:           "Europe/Berlin"

      # --- recordings -------------------------------------------------
      # The "Protokoll aufzeichnen" switch writes the log to a file that
      # you can download from the bridge itself. REC_HOST is only used to
      # build the link shown on the dashboard - put the address of this
      # machine here, otherwise the link points nowhere.
      REC_HOST:     "192.168.1.20"
      REC_PORT:     "8099"
      REC_MAX_MB:   "50"
      REC_KEEP:     "10"

    ports:
      - "8099:8099"

    volumes:
      # Recordings survive a container rebuild only if they live outside it.
      - ./recordings:/data/recordings

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
